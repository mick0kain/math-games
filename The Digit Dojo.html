<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Digit Dojo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #111;
            margin: 0;
            padding: 20px;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        #game-wrapper {
            background-color: #000;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 15px;
            border: 6px solid #f1c40f;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Top HUD: Health Bars */
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.9);
            border-bottom: 4px solid #333;
            position: relative;
            z-index: 5;
        }

        .health-container {
            width: 40%;
        }

        .name-tag {
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .health-bar-bg {
            width: 100%;
            height: 30px;
            background-color: #333;
            border: 3px solid #fff;
            border-radius: 5px;
            position: relative;
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #enemy-health-fill { background-color: #e74c3c; }

        /* The Battle Arena - Updated for Custom Background */
        .arena {
            height: 400px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 50px 30px 50px;
            
            /* THIS LOADS YOUR CUSTOM STAGE IMAGE */
            background-image: url('stage.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            position: relative;
        }

        /* Character Styles - Updated for Custom Images */
        .character {
            position: relative;
            z-index: 2;
            transition: transform 0.1s;
        }

        .char-img {
            height: 250px; /* Adjust this if the hero is too big/small */
            width: auto;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.8));
        }

        .boss-img {
            height: 320px; /* Makes the 4-armed monster bigger */
            width: auto;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.8));
        }

        .power-level {
            background-color: #fff;
            color: #000;
            padding: 10px 20px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 10px;
            border: 4px solid #f1c40f;
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #enemy-power { border-color: #e74c3c; }

        /* Combat Animations */
        @keyframes attackRight {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(200px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }
        @keyframes attackLeft {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(-200px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }
        @keyframes damageShake {
            0% { transform: translate(1px, 1px) rotate(0deg); filter: brightness(1) sepia(0); }
            20% { transform: translate(-5px, 0px) rotate(3deg); filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translate(1px, -1px) rotate(-1deg); }
            60% { transform: translate(-5px, 1px) rotate(0deg); }
            80% { transform: translate(5px, 1px) rotate(-3deg); filter: brightness(1) sepia(0); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        .combat-text {
            position: absolute;
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em;
            color: #f1c40f;
            text-shadow: 4px 4px 0 #000;
            pointer-events: none;
            animation: floatUp 1.5s forwards;
            z-index: 10;
        }

        /* Controls / Combo Buttons */
        .controls {
            background-color: #222;
            padding: 20px;
            border-top: 4px solid #444;
        }

        .instruction {
            font-size: 1.5em;
            color: #3498db;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .action-btn {
            background-color: #2980b9;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 2em;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1c5980;
            transition: 0.1s;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .action-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        
        .action-btn.multiply { background-color: #27ae60; box-shadow: 0 6px 0 #1e8449; }
        .action-btn.divide { background-color: #e67e22; box-shadow: 0 6px 0 #d35400; }

        /* End Screen */
        #end-screen {
            display: none;
            padding: 100px 20px;
        }
        h1 { font-family: 'Press Start 2P', cursive; color: #f1c40f; font-size: 3em; line-height: 1.5;}
        
        #btn-restart {
            background-color: #e74c3c;
            color: white;
            font-size: 2em;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            font-family: 'Press Start 2P', cursive;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        
        <!-- Game Interface -->
        <div id="game-screen">
            <div class="hud">
                <div class="health-container">
                    <div class="name-tag" style="color: #2ecc71; text-align: left;">Player</div>
                    <div class="health-bar-bg">
                        <div class="health-bar-fill" id="player-health-fill"></div>
                    </div>
                </div>
                <div class="health-container">
                    <div class="name-tag" style="color: #e74c3c; text-align: right;">Sensei Zero</div>
                    <div class="health-bar-bg">
                        <div class="health-bar-fill" id="enemy-health-fill"></div>
                    </div>
                </div>
            </div>

            <div class="arena" id="arena-box">
                <div class="character" id="player-char">
                    <!-- LOADS HERO IMAGE HERE -->
                    <img src="hero.png" alt="Hero" class="char-img">
                    <div class="power-level" id="player-power">Loading...</div>
                </div>
                <div class="character" id="enemy-char">
                    <!-- LOADS VILLAIN IMAGE HERE -->
                    <img src="villain.png" alt="Villain" class="boss-img">
                    <div class="power-level" id="enemy-power">Loading...</div>
                </div>
            </div>

            <div class="controls">
                <div class="instruction">Select the correct combo strike!</div>
                <div class="button-grid">
                    <button class="action-btn multiply" onclick="checkAttack(10)">× 10</button>
                    <button class="action-btn multiply" onclick="checkAttack(100)">× 100</button>
                    <button class="action-btn multiply" onclick="checkAttack(1000)">× 1,000</button>
                    <button class="action-btn divide" onclick="checkAttack(0.1)">÷ 10</button>
                    <button class="action-btn divide" onclick="checkAttack(0.01)">÷ 100</button>
                    <button class="action-btn divide" onclick="checkAttack(0.001)">÷ 1,000</button>
                </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen">
            <h1 id="end-title">K.O!</h1>
            <p style="font-size: 1.5em; margin-bottom: 40px;" id="end-message">You defeated the monster!</p>
            <button id="btn-restart" onclick="restartGame()">PLAY AGAIN</button>
        </div>

    </div>

    <script>
        const battles = [
            { start: 5432719, target: 54327190, action: 10 },
            { start: 327500, target: 3275, action: 0.01 },
            { start: 948374, target: 94837400, action: 100 },
            { start: 7657400, target: 765740, action: 0.1 },
            { start: 4000000, target: 40000000, action: 10 },
            { start: 6000000, target: 60000, action: 0.01 },
            { start: 8000, target: 8000000, action: 1000 },
            { start: 2000000, target: 2000, action: 0.001 }
        ];

        let currentRound = 0;
        let playerHealth = 100;
        let enemyHealth = 100;
        let isAnimating = false;

        const playerChar = document.getElementById('player-char');
        const enemyChar = document.getElementById('enemy-char');
        const arenaBox = document.getElementById('arena-box');

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        function loadRound() {
            let battle = battles[currentRound];
            document.getElementById('player-power').innerText = formatNumber(battle.start);
            document.getElementById('enemy-power').innerText = formatNumber(battle.target);
            isAnimating = false;
        }

        function spawnCombatText(text, isPlayerHit) {
            let damageText = document.createElement('div');
            damageText.className = 'combat-text';
            damageText.innerText = text;
            
            if (isPlayerHit) {
                damageText.style.left = '20%';
                damageText.style.top = '150px';
                damageText.style.color = '#e74c3c';
            } else {
                damageText.style.right = '20%';
                damageText.style.top = '150px';
                damageText.style.color = '#2ecc71';
            }
            
            arenaBox.appendChild(damageText);
            setTimeout(() => damageText.remove(), 1500);
        }

        function updateHealthBars() {
            document.getElementById('player-health-fill').style.width = playerHealth + '%';
            document.getElementById('enemy-health-fill').style.width = enemyHealth + '%';
        }

        function checkAttack(multiplier) {
            if (isAnimating) return;
            isAnimating = true;

            let battle = battles[currentRound];
            
            if (multiplier === battle.action) {
                playerChar.style.animation = "attackRight 0.5s ease";
                
                setTimeout(() => {
                    enemyChar.style.animation = "damageShake 0.5s ease";
                    spawnCombatText("CRITICAL HIT!", false);
                    
                    enemyHealth -= (100 / battles.length);
                    if(enemyHealth < 0) enemyHealth = 0;
                    updateHealthBars();
                }, 250);

            } else {
                enemyChar.style.animation = "attackLeft 0.5s ease";
                
                setTimeout(() => {
                    playerChar.style.animation = "damageShake 0.5s ease";
                    spawnCombatText("WRONG COMBO!", true);
                    
                    playerHealth -= 20; 
                    if(playerHealth < 0) playerHealth = 0;
                    updateHealthBars();
                }, 250);
            }

            setTimeout(() => {
                playerChar.style.animation = "";
                enemyChar.style.animation = "";
                
                if (playerHealth <= 0) {
                    endGame(false);
                } else if (multiplier === battle.action) {
                    currentRound++;
                    if (currentRound < battles.length) {
                        loadRound();
                    } else {
                        endGame(true);
                    }
                } else {
                    isAnimating = false; 
                }
            }, 1000);
        }

        function endGame(playerWon) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            if (playerWon) {
                document.getElementById('end-title').innerText = "VICTORY!";
                document.getElementById('end-title').style.color = "#2ecc71";
                document.getElementById('end-message').innerText = "You have mastered the powers of 10!";
            } else {
                document.getElementById('end-title').innerText = "GAME OVER";
                document.getElementById('end-title').style.color = "#e74c3c";
                document.getElementById('end-message').innerText = "The monster defeated you. Train harder!";
            }
        }

        function restartGame() {
            currentRound = 0;
            playerHealth = 100;
            enemyHealth = 100;
            updateHealthBars();
            
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('end-screen').style.display = 'none';
            loadRound();
        }

        window.onload = loadRound;
    </script>
</body>
</html>
